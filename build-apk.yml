name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Use a fixed, permanent signing key (prevents "app not installed" errors on update)
        run: |
          mkdir -p "$HOME/.android"
          base64 -d keystore/walid_keystore_base64.txt > "$HOME/.android/debug.keystore"

      - name: Generate Android platform files
        run: flutter create --platforms=android --project-name walid .

      - name: Get dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk WALID.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: WALID - نسخة ${{ github.run_number }}
          body: "بناء تلقائي لتطبيق WALID. حمّل ملف APK أدناه وثبّته على هاتفك."
          files: WALID.apk
